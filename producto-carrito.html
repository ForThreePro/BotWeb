<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><title>Carrito - Garfield Store</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><style>:root{ --naranja:#FF6B00; --naranja2:#FF8C00; --gris:#F5F5F7; --verde:#25D366; } body { background: var(--gris); font-family: 'Inter', sans-serif; } .btn-whatsapp { background: var(--verde); color: #fff; } .card { background: #fff; border: 1px solid #E5E5E7; }</style></head><body>
<header class="card p-4 flex items-center justify-between sticky top-0 z-30 shadow-sm"><a href="tienda.html" class="font-bold">← Seguir Comprando</a></header>
<div class="p-5 max-w-3xl mx-auto"><div class="card rounded-2xl p-6"><h1 class="text-3xl font-black">Tu Carrito</h1><div id="listaCarrito" class="mt-4 space-y-2"></div><p id="totalCarrito" class="text-2xl font-black mt-4"></p><button onclick="enviarWhatsApp()" class="btn-whatsapp w-full py-4 rounded-xl mt-6 font-bold text-lg">ENVIAR PEDIDO A WHATSAPP LU</button></div></div>
<script>let carrito = JSON.parse(localStorage.getItem('carrito')) || [];mostrarCarrito();function mostrarCarrito() { let lista = ''; let total = 0; carrito.forEach((p, i) => { lista += `<div class="flex justify-between"><p>${i+1}. ${p.nombre}</p><p>S/ ${p.precio}</p></div>`; total += p.precio; }); document.getElementById('listaCarrito').innerHTML = lista || 'Carrito vacío'; document.getElementById('totalCarrito').innerText = 'Total: S/ ' + total + '.00'; }function enviarWhatsApp() { if(carrito.length === 0) return alert('Tu carrito está vacío'); let total = carrito.reduce((sum, item) => sum + item.precio, 0); let mensaje = `*HOLA LU, QUIERO COMPRAR*%0A%0A*PRODUCTOS:*%0A`; carrito.forEach((item, i) => { mensaje += `${i+1}. ${item.nombre} - S/ ${item.precio}.00%0A`; }); mensaje += `%0A*TOTAL: S/ ${total}.00*%0A%0A*DATOS:*%0A Nombre: _%0A Método: _%0A ID: _%0A%0A Espero confirmación! 🙏`; window.open(`https://wa.me/51920726588?text=${mensaje}`, '_blank'); localStorage.removeItem('carrito'); carrito = []; mostrarCarrito(); }</script></body></html>
