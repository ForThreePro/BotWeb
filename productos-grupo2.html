<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><title>Grupo 2 - Garfield Store</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><style>:root{ --naranja:#FF6B00; --naranja2:#FF8C00; --gris:#F5F5F7; } body { background: var(--gris); font-family: 'Inter', sans-serif; } .btn-primary { background: linear-gradient(90deg, var(--naranja), var(--naranja2)); color: #fff; } .card { background: #fff; border: 1px solid #E5E5E7; }</style></head><body>
<header class="card p-4 flex items-center justify-between sticky top-0 z-30 shadow-sm"><a href="tienda.html" class="font-bold">← Volver</a><a href="producto-carrito.html" id="btnCarrito" class="card px-5 py-2.5 rounded-xl font-bold">🛒 Carrito 0</a></header>
<div class="p-5 max-w-4xl mx-auto space-y-6">

<div id="numeros" class="card rounded-2xl p-6"><p class="text-5xl">📱</p><h1 class="text-3xl font-black mt-3">Número USA para WhatsApp</h1><p class="text-4xl font-black text-orange-500 mt-4">S/ 25.00</p><button onclick="agregarCarrito('Número USA', 25)" class="btn-primary w-full py-4 rounded-xl mt-6 font-bold">AÑADIR AL CARRITO</button></div>

<div id="seguidores" class="card rounded-2xl p-6"><p class="text-5xl">👥</p><h1 class="text-3xl font-black mt-3">Seguidores Instagram</h1><p><b>500:</b> S/ 2.00</p><p><b>1000:</b> S/ 5.00</p><p><b>2000:</b> S/ 9.00</p><button onclick="agregarCarrito('1000 Seguidores', 5)" class="btn-primary w-full py-4 rounded-xl mt-6 font-bold">AÑADIR 1000 S/5</button></div>

<div id="vistas" class="card rounded-2xl p-6"><p class="text-5xl">👁️</p><h1 class="text-3xl font-black mt-3">10K Vistas TikTok</h1><p class="text-4xl font-black text-orange-500 mt-4">S/ 12.00</p><button onclick="agregarCarrito('10K Vistas TikTok', 12)" class="btn-primary w-full py-4 rounded-xl mt-6 font-bold">AÑADIR AL CARRITO</button></div>

<div id="likes" class="card rounded-2xl p-6"><p class="text-5xl">❤️</p><h1 class="text-3xl font-black mt-3">500 Likes Instagram</h1><p class="text-4xl font-black text-orange-500 mt-4">S/ 8.00</p><button onclick="agregarCarrito('500 Likes', 8)" class="btn-primary w-full py-4 rounded-xl mt-6 font-bold">AÑADIR AL CARRITO</button></div>

<div id="diamantes" class="card rounded-2xl p-6"><p class="text-5xl">💎</p><h1 class="text-3xl font-black mt-3">Recargas Free Fire</h1><div class="mt-4 grid md:grid-cols-2 gap-4 text-sm"><div class="bg-orange-50 rounded-xl p-4"><p class="font-black">🇵🇪 PERÚ CON STOCK</p><p>110💎 S/2.50 | 341💎 S/7.00</p></div></div><button onclick="agregarCarrito('110 Diamantes', 2.50)" class="btn-primary py-3 rounded-xl font-bold mt-4">110💎 S/2.50</button></div>

</div>
<script>let carrito = JSON.parse(localStorage.getItem('carrito')) || [];actualizarCarrito();function agregarCarrito(nombre, precio) { carrito.push({nombre, precio}); localStorage.setItem('carrito', JSON.stringify(carrito)); actualizarCarrito(); alert('✅ ' + nombre + ' añadido'); }function actualizarCarrito() { document.getElementById('btnCarrito').innerText = `🛒 Carrito ${carrito.length}`; }</script></body></html>
