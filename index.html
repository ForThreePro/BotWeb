<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garfield Store</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{ --naranja:#FF6B00; --naranja2:#FF8C00; --gris:#F5F5F7; }
  body { background: var(--gris); font-family: 'Inter', sans-serif; }
  .btn-primary { background: linear-gradient(90deg, var(--naranja), var(--naranja2)); color: #fff; }
</style>
</head>
<body>

<audio id="bgMusic" src="garfield.mp3" loop autoplay></audio>

<div class="min-h-screen flex-col items-center justify-center p-5 text-center">
  <img src="https://i.imgur.com/TU_IMAGEN_AQUI.png" class="w-32 h-32 rounded-3xl mb-6">
  <h1 class="text-5xl font-black"><span class="text-orange-500">Garfield</span> Store</h1>
  <p class="text-gray-600 mt-3 mb-8">Servicios digitales con la actitud de Garfield 🍕</p>
  <a href="tienda.html" class="btn-primary px-10 py-4 rounded-2xl font-bold text-lg">ENTRAR A LA TIENDA</a>
  
  <button onclick="toggleMusic()" id="btnMusic" class="mt-8 text-3xl">🔊</button>
</div>

<script>
const music = document.getElementById('bgMusic');
music.volume = 0.3;
function toggleMusic() {
  if(music.paused) { music.play(); document.getElementById('btnMusic').innerText = '🔊'; } 
  else { music.pause(); document.getElementById('btnMusic').innerText = '🔇'; }
}
</script>
</body>
</html>
