<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generador BRAT Sticker</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { background: #0a0a0f; }
.card { background: #15151d; border: 1px solid #2a2a35; }
.btn-gradient { background: linear-gradient(90deg, #22c55e, #16a34a); }
</style>
</head>
<body class="text-white font-sans">

<div class="max-w-lg mx-auto p-4">
  <div class="flex items-center gap-2 mb-6">
    <span class="text-2xl">🏷️</span>
    <h1 class="text-2xl font-bold">Generador BRAT</h1>
  </div>

  <div class="card rounded-xl p-6 mb-4">
    <p class="text-gray-400 text-sm mb-3">Escribe el texto para tu sticker estilo brat</p>
    <input id="texto" placeholder="ej: ArcadiaCorps" 
      class="w-full card rounded-xl px-4 py-3 outline-none mb-3">
    
    <button onclick="generar()" class="btn-gradient w-full py-3 rounded-xl font-bold">
      ✨ Generar Sticker
    </button>
  </div>

  <!-- Resultado -->
  <div id="resultado" class="card rounded-xl p-6 text-center hidden">
    <p class="mb-3">Tu sticker:</p>
    <img id="imgSticker" class="mx-auto bg-white rounded-lg mb-3"/>
    <a id="btnDescargar" download="sticker.webp" 
      class="btn-gradient px-5 py-2 rounded-xl inline-block font-bold">
      ⬇️ Descargar .webp
    </a>
  </div>

  <p id="estado" class="text-center text-gray-400 mt-4"></p>
</div>

<script>
const proxy = "https://api.allorigins.win/raw?url="; // Para evitar CORS

async function generar() {
  let texto = document.getElementById('texto').value;
  if(!texto) return alert('Escribe un texto');

  document.getElementById('estado').innerText = "⏳ Generando... espera 5s";
  document.getElementById('resultado').classList.add('hidden');

  let url = `https://kepolu-brat.hf.space/brat?q=${encodeURIComponent(texto)}`;
  let proxyUrl = proxy + encodeURIComponent(url);

  try {
    // La API devuelve imagen/arraybuffer
    const res = await fetch(proxyUrl);
    if(!res.ok) throw new Error("Error " + res.status);
    
    const blob = await res.blob();
    const imageUrl = URL.createObjectURL(blob);

    document.getElementById('imgSticker').src = imageUrl;
    document.getElementById('btnDescargar').href = imageUrl;
    document.getElementById('resultado').classList.remove('hidden');
    document.getElementById('estado').innerText = "✅ Listo";

  } catch(e) {
    document.getElementById('estado').innerText = "❌ Error: " + e.message;
    console.error(e);
  }
}
</script>
</body>
</html>
