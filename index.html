<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GPT-4 Web</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { background: #0a0a0f; }
.card { background: #15151d; border: 1px solid #2a2a35; }
.btn-gradient { background: linear-gradient(90deg, #3b82f6, #9333ea); }
</style>
</head>
<body class="text-white font-sans">

<div class="max-w-2xl mx-auto p-4">
  <div class="flex items-center gap-2 mb-6">
    <span class="text-yellow-400 text-2xl">⚡</span>
    <h1 class="text-2xl font-bold">GPT-4 Web</h1>
  </div>

  <div id="chat" class="card rounded-xl p-4 h-[500px] overflow-y-auto mb-3">
    <div class="text-left mb-3">
      <div class="inline-block p-3 rounded-2xl bg-gray-700">Hola 👋 Soy GPT-4. ¿En qué te ayudo?</div>
    </div>
  </div>

  <div class="flex gap-2">
    <input id="mensaje" onkeypress="if(event.key==='Enter') enviar()" placeholder="Escribe algo para hablar con GPT-4..."
      class="flex-1 card rounded-xl px-4 py-3 outline-none">
    <button onclick="enviar()" class="btn-gradient px-5 rounded-xl font-bold">➤</button>
  </div>
</div>

<script>
const KEY = "sastuke"; // viene de Buffer.from('c2FzdWtl', 'base64')
const SESSION = "12";
const proxy = "https://corsproxy.io/?"; // para que no falle CORS

async function enviar() {
  let texto = document.getElementById('mensaje').value;
  if(!texto) return;

  agregarChat("tu", texto);
  document.getElementById('mensaje').value = "";
  agregarChat("ia", "⏳ Procesando...");

  try {
    const url = `https://api.evogb.org/ai/gpt4-session?text=${encodeURIComponent(texto)}&session=${SESSION}&key=${KEY}`;
    const res = await fetch(proxy + encodeURIComponent(url));
    const json = await res.json();

    document.getElementById('chat').lastChild.remove(); // quita "Procesando"

    if (json.status) {
      agregarChat("ia", json.result);
    } else {
      agregarChat("ia", "❌ No se pudo obtener respuesta");
    }
  } catch(e) {
    document.getElementById('chat').lastChild.remove();
    agregarChat("ia", "❌ Error: " + e.message);
  }
}

function agregarChat(rol, texto) {
  let chat = document.getElementById('chat');
  let clase = rol === 'tu'? 'text-right' : 'text-left';
  let color = rol === 'tu'? 'bg-blue-600' : 'bg-gray-700';
  chat.innerHTML += `<div class="mb-3 ${clase}"><div class="inline-block p-3 rounded-2xl ${color} whitespace-pre-wrap">${texto}</div></div>`;
  chat.scrollTop = chat.scrollHeight;
}
</script>
</body>
</html>
