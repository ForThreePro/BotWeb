<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garfield Store</title>
<style>
  :root{
    --bg:#000;
    --bg-light:#f5f5f7;
    --text:#1d1d1f;
    --text-muted:#6e6e73;
    --accent:#ff3b30;
    --maxw:1200px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Arial, sans-serif; color:var(--text); background:#fff}
  nav{position:fixed; top:0; width:100%; backdrop-filter: blur(20px); background:rgba(0,0,0,0.7); z-index:100}
  .container{max-width:var(--maxw); margin:0 auto; padding:0 20px}
  .nav-wrap{display:flex; justify-content:space-between; align-items:center; height:60px; color:#fff}
  .logo{font-weight:700; font-size:22px}
  .nav-right{display:flex; gap:20px; align-items:center}
  .cart-btn{position:relative; cursor:pointer; font-size:14px; background:var(--accent); padding:8px 16px; border-radius:20px; border:none; color:#fff}
  .cart-count{position:absolute; top:-6px; right:-6px; background:#fff; color:var(--accent); font-size:11px; font-weight:700; border-radius:50%; width:18px; height:18px; display:flex; align-items:center; justify-content:center}

  .hero{height:100vh; background: url('https://files.evogb.win/sRJ0HB.jpg') center/cover no-repeat; display:flex; align-items:center; justify-content:center; text-align:center; position:relative}
  .hero::after{content:''; position:absolute; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.45)}
  .hero-content{position:relative; z-index:2; color:#fff}
  .hero h1{font-size:64px; font-weight:700; letter-spacing:-2px}
  .hero p{font-size:22px; margin:18px 0 30px}
  .btn{padding:14px 24px; border-radius:980px; font-size:17px; font-weight:600; text-decoration:none; transition:.2s; border:none; cursor:pointer}
  .btn-primary{background:var(--accent); color:#fff}
  .btn-primary:hover{background:#ff5144}

  .banner-section{padding:0; margin:0}
  .banner-section img{width:100%; height:auto; display:block}

  .section{padding:100px 20px}
  .section h2{font-size:48px; font-weight:700; text-align:center; margin-bottom:16px}
  .section p.sub{font-size:20px; color:var(--text-muted); text-align:center; max-width:700px; margin:0 auto 60px}
  
  .products{display:grid; grid-template-columns:repeat(auto-fit, minmax(280px,1fr)); gap:30px}
  .product{background:#fff; border-radius:20px; overflow:hidden; box-shadow:0 10px 30px rgba(0,0,0,.08); transition:.3s}
  .product:hover{transform:translateY(-6px)}
  .product img{width:100%; height:300px; object-fit:cover}
  .product-info{padding:20px}
  .product-info h3{font-size:20px; margin-bottom:8px}
  .product-info p{color:var(--text-muted); font-size:14px; margin-bottom:12px}
  .price{font-size:22px; font-weight:700; color:var(--accent); margin-bottom:16px}
  .add-btn{width:100%; padding:12px; background:#000; color:#fff; border:none; border-radius:12px; font-weight:600; cursor:pointer}
  .add-btn:hover{background:#333}

  .cart-sidebar{position:fixed; right:-400px; top:0; width:380px; height:100%; background:#fff; box-shadow:-5px 0 30px rgba(0,0,0,.2); transition:.3s; z-index:200; padding:20px; display:flex; flex-direction:column}
  .cart-sidebar.active{right:0}
  .cart-header{display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #eee; padding-bottom:15px}
  .close-cart{font-size:24px; cursor:pointer; background:none; border:none}
  .cart-items{flex:1; overflow-y:auto; margin:20px 0}
  .cart-item{display:flex; gap:12px; margin-bottom:15px; padding-bottom:15px; border-bottom:1px solid #f5f5f5}
  .cart-item img{width:70px; height:70px; object-fit:cover; border-radius:10px}
  .cart-total{font-size:20px; font-weight:700; text-align:right; margin-bottom:15px}
  .checkout-btn{width:100%; padding:16px; background:#25D366; color:#fff; border:none; border-radius:12px; font-size:16px; font-weight:700; cursor:pointer}
  .checkout-btn:hover{background:#1ebe5b}
  .overlay{position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); display:none; z-index:150}
  .overlay.active{display:block}

  footer{background:#000; padding:40px 20px; color:#a1a1a6; text-align:center}
  @media(max-width:768px){.hero h1{font-size:42px} .cart-sidebar{width:100%; right:-100%}}
</style>
</head>
<body>

<nav>
  <div class="container nav-wrap">
    <div class="logo">Garfield Store</div>
    <div class="nav-right">
      <button class="cart-btn" onclick="toggleCart()">
        Carrito <span class="cart-count" id="cart-count">0</span>
      </button>
    </div>
  </div>
</nav>

<section class="hero">
  <div class="hero-content">
    <h1>Garfield Store</h1>
    <p>Estilo. Comodidad. Actitud.</p>
    <a href="#productos" class="btn btn-primary">Ver colección</a>
  </div>
</section>

<!-- TU NUEVA IMAGEN "FOTO INICIO" -->
<section class="banner-section">
  <img src="https://files.evogb.win/2gepcp.jpg" alt="Foto Inicio Garfield Store">
</section>

<section id="productos" class="section">
  <div class="container">
    <h2>Productos Destacados</h2>
    <p class="sub">Calidad premium. Envíos a todo Perú.</p>
    <div class="products" id="products-grid"></div>
  </div>
</section>

<div class="overlay" onclick="toggleCart()"></div>
<div class="cart-sidebar" id="cart">
  <div class="cart-header">
    <h3>Tu Carrito</h3>
    <button class="close-cart" onclick="toggleCart()">×</button>
  </div>
  <div class="cart-items" id="cart-items"></div>
  <div class="cart-total">Total: S/ <span id="cart-total">0.00</span></div>
  <button class="checkout-btn" onclick="checkoutWhatsApp()">Pedir por WhatsApp</button>
</div>

<footer>
  © 2026 Garfield Store. Lima, Perú
</footer>

<script>
  const WHATSAPP_NUMBER = "51999999999"; // <-- CAMBIA ESTO POR TU NUMERO

  const products = [
    {id:1, name:"Polo Garfield Classic", price:59.90, img:"https://files.evogb.win/2gepcp.jpg", desc:"Algodón 100% premium"},
    {id:2, name:"Hoodie Negro Garfield", price:129.90, img:"https://via.placeholder.com/400x400/000000/ffffff?text=Hoodie", desc:"Franela gruesa"},
    {id:3, name:"Gorra Bordada", price:45.00, img:"https://via.placeholder.com/400x400/f5f5f7/000?text=Gorra", desc:"Ajustable"},
    {id:4, name:"Pack 2 Polos", price:99.90, img:"https://via.placeholder.com/400x400/ff3b30/ffffff?text=Pack", desc:"Ahorra 20 soles"}
  ];

  let cart = [];

  function renderProducts(){
    const grid = document.getElementById('products-grid');
    grid.innerHTML = products.map(p => `
      <div class="product">
        <img src="${p.img}" alt="${p.name}">
        <div class="product-info">
          <h3>${p.name}</h3>
          <p>${p.desc}</p>
          <div class="price">S/ ${p.price.toFixed(2)}</div>
          <button class="add-btn" onclick="addToCart(${p.id})">Agregar al carrito</button>
        </div>
      </div>
    `).join('');
  }

  function addToCart(id){
    const product = products.find(p => p.id === id);
    const item = cart.find(i => i.id === id);
    if(item){ item.qty++; } else { cart.push({...product, qty:1}) }
    updateCart();
  }

  function updateCart(){
    document.getElementById('cart-count').innerText = cart.reduce((a,b)=>a+b.qty,0);
    const cartItems = document.getElementById('cart-items');
    if(cart.length === 0){ cartItems.innerHTML = "<p style='text-align:center; color:#999'>Tu carrito está vacío</p>"; }
    else {
      cartItems.innerHTML = cart.map(item => `
        <div class="cart-item">
          <img src="${item.img}">
          <div class="cart-item-info">
            <h4>${item.name}</h4>
            <p>S/ ${item.price.toFixed(2)} x ${item.qty}</p>
          </div>
        </div>
      `).join('');
    }
    const total = cart.reduce((a,b)=>a + b.price*b.qty,0);
    document.getElementById('cart-total').innerText = total.toFixed(2);
  }

  function toggleCart(){
    document.getElementById('cart').classList.toggle('active');
    document.querySelector('.overlay').classList.toggle('active');
  }

  function checkoutWhatsApp(){
    if(cart.length === 0) return alert("Tu carrito está vacío");
    let message = "Hola Garfield Store! 👋 Quiero hacer este pedido:%0A%0A";
    cart.forEach(item => {
      message += `• ${item.name} x${item.qty} - S/ ${(item.price*item.qty).toFixed(2)}%0A`;
    });
    const total = cart.reduce((a,b)=>a + b.price*b.qty,0);
    message += `%0A*Total: S/ ${total.toFixed(2)}*%0A%0A¿Me confirman disponibilidad y envío?`;
    window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${message}`, '_blank');
  }

  renderProducts();
</script>

</body>
</html>
