<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garfield - SBD</title><style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');:root{--prim:#FF6A00;--sec:#FFB700;--fondo:#000;--card:#111111CC;--texto:#fff}*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}body{background:var(--fondo);color:var(--texto)}
nav{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;position:sticky;top:0;background:rgba(0,0,0,0.8);backdrop-filter:blur(20px);border-bottom:1px solid #1a1a1a}
.logo-circulo{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--prim),var(--sec));display:flex;align-items:center;justify-content:center;font-weight:800;color:#000;font-size:14px}
.hamburguesa{display:flex;flex-direction:column;gap:6px;cursor:pointer}.hamburguesa span{width:24px;height:2px;background:var(--prim)}
.menu-lateral{position:fixed;top:0;left:-100%;width:85%;max-width:320px;height:100%;background:#0a0a0a;padding:100px 25px;transition:0.4s;z-index:999}.menu-lateral.activo{left:0}.overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);display:none;z-index:998}.overlay.activo{display:block}
.menu-lateral a{display:block;color:var(--texto);text-decoration:none;padding:16px 0;font-size:17px;font-weight:500;border-bottom:1px solid #1a1a1a}
.container{max-width:800px;margin:0 auto;padding:0 20px}
.titulo{font-size:2.5rem;font-weight:800;text-align:center;padding:40px 0;background:linear-gradient(135deg,var(--prim),var(--sec));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.tabs{display:flex;gap:10px;justify-content:center;margin-bottom:30px;overflow-x:auto}.tab-btn{background:#222;color:white;padding:12px 20px;border:none;border-radius:50px;cursor:pointer;font-weight:600;white-space:nowrap}
.tab-btn.activo{background:linear-gradient(135deg,var(--prim),var(--sec));color:#000}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.card{background:var(--card);backdrop-filter:blur(20px);padding:16px;border-radius:20px;border:1px solid #222;text-align:center}
.card img{width:100%;border-radius:12px;margin-bottom:10px}.btn{background:linear-gradient(135deg,var(--prim),var(--sec));color:#000;padding:10px 20px;border-radius:50px;text-decoration:none;font-weight:700;font-size:14px}</style></head><body>
<div class="overlay" onclick="toggleMenu()"></div><div class="menu-lateral" id="menu"><a href="index.html">🏠 Inicio</a><a href="diamantes.html">💎 Diamantes</a><a href="bots.html">🤖 Bots</a><a href="spam.html">📢 Spam</a><a href="design.html">🎨 Design</a><a href="garfield.html">🐱 Garfield</a><a href="nosotros.html">👤 Sobre Nosotros</a><a href="https://wa.me/51999999">💬 WhatsApp</a></div>
<nav><div class="hamburguesa" onclick="toggleMenu()"><span></span><span></span><span></span></div><div class="logo-circulo">SBD</div><div></div></nav>
<div class="container"><h1 class="titulo">Garfield Zone</h1>
<div class="tabs"><button class="tab-btn activo" onclick="mostrarTab('memes')">😂 Memes</button><button class="tab-btn" onclick="mostrarTab('stickers')">🏷️ Stickers</button></div>
<div id="memes" class="tab-content"><div class="grid">
<div class="card"><img src="https://placehold.co/400x400/FF6A00/000?text=1.Lunes"><p>Odio los lunes</p><a href="#" class="btn">Descargar</a></div>
<div class="card"><img src="https://placehold.co/400x400/FF6A00/000?text=2.Lasaña"><p>Lasaña Time</p><a href="#" class="btn">Descargar</a></div>
<div class="card"><img src="https://placehold.co/400x400/FF6A00/000?text=3.Dieta"><p>La dieta mañana</p><a href="#" class="btn">Descargar</a></div>
<div class="card"><img src="https://placehold.co/400x400/FF6A00/000?text=4.Dormir"><p>5 min más</p><a href="#" class="btn">Descargar</a></div>
</div></div>
<div id="stickers" class="tab-content" style="display:none"><div class="grid">
<div class="card"><img src="https://placehold.co/400x400/FFB700/000?text=Sticker1"><p>Sticker Dormilón</p><a href="#" class="btn">Descargar</a></div>
</div></div></div>
<script>function toggleMenu(){document.getElementById('menu').classList.toggle('activo');document.querySelector('.overlay').classList.toggle('activo');}
function mostrarTab(id){document.querySelectorAll('.tab-content').forEach(t=>t.style.display='none');document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('activo'));document.getElementById(id).style.display='block';event.target.classList.add('activo');}</script></body></html>
