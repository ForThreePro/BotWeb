<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garfield Store - Productos</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 20; }
  .overlay.active { display: block; }
</style>
</head>
<body class="bg-[#000] text-white font-sans">
  <div class="h-8 bg-blue-600 w-full"></div>
  <header class="sticky top-8 z-40 bg-[#0A0A0A]/80 backdrop-blur border-b border-white/5 h-14">
    <div class="flex items-center justify-between px-4 h-full">
      <div class="flex items-center gap-3"><button onclick="toggleSidebar()" class="p-2 rounded-lg hover:bg-white/5"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="18" y2="18"/></svg></button><div class="flex items-center gap-2"><div class="w-9 h-9 rounded-lg bg-gradient-to-br from-orange-500 to-red-500 flex items-center justify-center font-bold text-lg">G</div><h1 class="text-lg font-semibold">Garfield<span class="text-green-400">Store</span></h1></div></div>
      <button class="p-2 rounded-xl bg-[#111]">🔔</button>
    </div>
  </header>
  <div id="overlay" class="overlay" onclick="toggleSidebar()"></div>
  <div class="flex">
    <aside id="sidebar" class="fixed md:static inset-y-0 left-0 z-30 w-64 bg-[#0A0A0A] border-r border-white/5 -translate-x-full md:translate-x-0 transition-transform duration-300">
      <div class="p-4 space-y-3">
        <div class="rounded-xl bg-[#111] p-2"><button onclick="toggleSection('portal')" class="w-full flex justify-between text-xs">🏠 PORTAL <span id="arrow-portal">▼</span></button><div id="portal" class="mt-2 hidden"><a href="index.html" class="block px-3 py-2 rounded-lg text-sm hover:bg-white/5">Inicio</a><a href="garfield.html" class="block px-3 py-2 rounded-lg text-sm hover:bg-white/5">Zona Garfield</a></div></div>
        <div class="rounded-xl bg-[#111] p-2"><button onclick="toggleSection('redes')" class="w-full flex justify-between text-xs">💬 REDES <span id="arrow-redes">▼</span></button><div id="redes" class="mt-2 hidden"><a href="redes.html" class="block px-3 py-2 rounded-lg text-sm hover:bg-white/5">Canal de WhatsApp</a><a href="redes.html" class="block px-3 py-2 rounded-lg text-sm hover:bg-white/5">Comunidad WhatsApp</a></div></div>
        <div class="rounded-xl bg-[#111] p-2"><button onclick="toggleSection('shop')" class="w-full flex justify-between text-xs">🛍️ GARFIELD SHOP <span id="arrow-shop">▲</span></button><div id="shop" class="mt-2"><a href="tienda.html" class="block px-3 py-2 rounded-lg text-sm hover:bg-white/5">Tienda</a><a href="productos.html" class="block px-3 py-2 rounded-lg text-sm bg-gradient-to-r from-purple-600/30 to-blue-600/30">Productos</a></div></div>
      </div>
    </aside>
    <main class="flex-1 p-6">
      <div class="flex items-center justify-between mb-4"><div><div class="text-xs text-cyan-400">CATÁLOGO</div><h2 class="text-2xl font-bold">Todos los productos</h2></div><input id="search" onkeyup="render()" placeholder="Buscar producto..." class="bg-[#111] border-white/10 rounded-xl px-3 py-2 text-sm w-60"></div>
      <div class="flex gap-2 flex-wrap mb-4"><button onclick="setCategory('Todos')" class="cat-btn px-4 py-2 rounded-lg text-sm bg-gradient-to-r from-blue-600 to-purple-600">Todos</button><button onclick="setCategory('Streaming')" class="cat-btn px-4 py-2 rounded-lg text-sm bg-[#111]">Streaming</button><button onclick="setCategory('Música')" class="cat-btn px-4 py-2 rounded-lg text-sm bg-[#111]">Música</button><button onclick="setCategory('Software')" class="cat-btn px-4 py-2 rounded-lg text-sm bg-[#111]">Software</button></div>
      <div id="products" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>
    </main>
  </div>
<script>
let products = [
  {cat:"Streaming", name:"Netflix Premium 1 Pantalla", price:15, old:20, disc:25, rating:4.9},
  {cat:"Streaming", name:"HBO Max Premium", price:14, old:18, disc:0, rating:4.8, agotado:true},
  {cat:"Streaming", name:"Prime Video", price:12, old:14, disc:25, rating:4.9},
  {cat:"Música", name:"Spotify Premium Individual", price:10, old:14, disc:29, rating:4.9},
  {cat:"Software", name:"Canva Pro", price:18, old:25, disc:28, rating:4.9},
];
let currentCat = 'Todos';
function render(){
  const cont = document.getElementById('products'); const search = document.getElementById('search').value.toLowerCase(); cont.innerHTML = '';
  products.filter(p => (currentCat==='Todos'||p.cat===currentCat) && p.name.toLowerCase().includes(search)).forEach(p=>{
    cont.innerHTML += `<div class="bg-[#0A0A0A] border-white/5 rounded-2xl p-4"><div class="mb-2">${p.disc?`<span class="text-xs bg-purple-600/30 px-2 py-1 rounded">-${p.disc}%</span>`:p.agotado?`<span class="text-xs bg-red-600/30 px-2 py-1 rounded">Agotado</span>`:''}</div><div class="text-xs text-cyan-400 mb-1">${p.cat}</div><div class="font-semibold mb-1">${p.name}</div><div class="text-xs text-yellow-400 mb-2">★ ${p.rating}</div><div class="text-lg font-bold text-green-400">S/ ${p.price.toFixed(2)} <span class="text-sm text-white/40 line-through">S/ ${p.old.toFixed(2)}</span></div><button class="mt-3 w-full py-2 rounded-lg bg-gradient-to-r from-blue-600 to-purple-600 text-sm font-medium">Añadir al carrito</button></div>`;
  })
}
function setCategory(c){ currentCat = c; document.querySelectorAll('.cat-btn').forEach(b=>b.className='cat-btn px-4 py-2 rounded-lg text-sm bg-[#111]'); event.target.className='cat-btn px-4 py-2 rounded-lg text-sm bg-gradient-to-r from-blue-600 to-purple-600'; render(); }
render();
function toggleSidebar(){ const sidebar = document.getElementById('sidebar'); const overlay = document.getElementById('overlay'); sidebar.classList.toggle('-translate-x-full'); overlay.classList.toggle('active'); }
function toggleSection(id){ document.getElementById(id).classList.toggle('hidden'); document.getElementById('arrow-'+id).innerText = document.getElementById(id).classList.contains('hidden')? '▼' : '▲'; }
document.querySelectorAll('#sidebar a').forEach(link => { link.addEventListener('click', () => { if(window.innerWidth < 768){ toggleSidebar(); } }) })
</script
