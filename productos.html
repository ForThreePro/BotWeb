<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Productos</title>
<style>
  :root{--naranja:#FF8C00;--naranja2:#FF4500;--fondo:#0A0A0F;--card:#12121A;--borde:#1E1E2A;}
  body{background:var(--fondo);color:#fff;font-family:Roboto;}
  .topbar{height:4px;background:linear-gradient(90deg,var(--naranja),var(--naranja2));}
  header{display:flex;align-items:center;gap:12px;padding:12px 16px;background:#0F0F14;border-bottom:1px solid var(--borde);}
  .logo{display:flex;align-items:center;gap:10px;font-weight:700;} .logo img{width:32px;height:32px;border-radius:8px;}
  .menu-btn{background:#1A1A24;border:1px solid var(--borde);color:#fff;padding:10px;border-radius:12px;}
  .buscador{margin:16px;padding:12px;background:var(--card);border:1px solid var(--borde);border-radius:12px;color:#fff;width:calc(100% - 32px);}
  .filtros{display:flex;gap:8px;padding:0 16px 16px;overflow-x:auto;}
  .filtros button{background:#1A1A24;border:1px solid var(--borde);color:#fff;padding:8px 14px;border-radius:10px;}
  .filtros .active{background:linear-gradient(135deg,var(--naranja),var(--naranja2));border:none;}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:16px;}
  .prod{background:var(--card);border:1px solid var(--borde);border-radius:16px;padding:12px;}
  .precio{font-size:18px;font-weight:700;margin:6px 0;color:var(--naranja);}
  .btn{background:linear-gradient(135deg,var(--naranja),var(--naranja2));border:none;color:#fff;width:100%;padding:10px;border-radius:10px;font-weight:600;}
  .sidebar{position:fixed;top:0;left:-300px;width:280px;height:100%;background:#0F0F14;transition:0.3s;padding-top:60px;z-index:101;border-right:1px solid var(--borde);}
  .sidebar.active{left:0;} .sidebar a{display:block;padding:12px 20px;color:#ccc;text-decoration:none;}
  .overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);z-index:100;}
  .overlay.active{display:block;}
</style>
</head><body>
<div class="topbar"></div>
<header><button class="menu-btn" onclick="toggleMenu()">☰</button><div class="logo"><img src="https://files.evogb.win/2gepcp.jpg"> Productos</div></header>

<div class="sidebar" id="menu">
  <a href="index.html">🏠 Inicio</a><a href="garfield.html">🐱 Garfield</a><a href="productos.html">🛒 Productos</a><a href="tienda.html">🛍️ Tienda</a><a href="redes.html">📱 Redes</a>
</div><div class="overlay" onclick="toggleMenu()"></div>

<input class="buscador" placeholder="🔍 Buscar producto...">
<div class="filtros"><button class="active">Todos</button><button>Bots</button><button>Diamantes</button></div>

<div class="grid">
  <div class="prod"><div class="precio">S/ 15.00</div><div>Diamantes 100</div><button class="btn" onclick="agregar('Diamantes - S/15')">Añadir</button></div>
  <div class="prod"><div class="precio">S/ 10.00</div><div>Bot WhatsApp</div><button class="btn" onclick="agregar('Bot - S/10')">Añadir</button></div>
</div>

<script>
let carrito=[];
function agregar(p){carrito.push(p);localStorage.setItem('carrito',JSON.stringify(carrito));alert(p+' agregado')}
function toggleMenu(){document.getElementById('menu').classList.toggle('active');document.querySelector('.overlay').classList.toggle('active');}
</script>
</body></html>
