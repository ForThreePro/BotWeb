<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Productos - Garfield Store</title>
<style>
  body{background:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:40px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px;max-width:1000px;margin:auto;}
  .item{background:#F5F5F7;border-radius:18px;padding:20px;text-align:center;}
  .item img{width:100%;border-radius:12px;margin-bottom:12px;}
  .precio{font-size:22px;font-weight:700;color:#FF8C00;margin:10px 0;}
  .btn{background:#FF8C00;color:#fff;padding:10px 20px;border-radius:12px;text-decoration:none;display:inline-block;}
</style>
</head>
<body>
  <h2 style="text-align:center;margin-bottom:40px;">Nuestros Productos</h2>
  <div class="grid">
    <div class="item">
      <img src="https://via.placeholder.com/300x200" alt="Diamantes">
      <h3>Diamantes</h3>
      <p class="precio">$5.00</p>
      <p>Recarga instantánea para tu juego</p>
      <a href="tienda.html" class="btn">Comprar</a>
    </div>
    <div class="item">
      <img src="https://via.placeholder.com/300x200" alt="Bots">
      <h3>Bots</h3>
      <p class="precio">$10.00</p>
      <p>Bots para WhatsApp y Telegram</p>
      <a href="tienda.html" class="btn">Comprar</a>
    </div>
  </div>
</body>
</html>
