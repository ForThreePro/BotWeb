<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Productos - GarfieldCorp</title>
<style>
  body{background:#0A0A0F;color:#fff;font-family:Roboto;padding-bottom:80px;}
  header{display:flex;align-items:center;gap:12px;padding:12px 16px;background:#0F0F14;position:sticky;top:0;}
  .menu-btn{background:#1A1A24;border:none;color:#fff;padding:10px;border-radius:12px;}
  .filtros{display:flex;gap:8px;padding:16px;overflow-x:auto;}
  .filtros button{background:#1A1A24;border:1px solid #2A2A3A;color:#fff;padding:8px 14px;border-radius:10px;}
  .filtros .active{background:linear-gradient(135deg,#00D4FF,#8B5CF6);border:none;}
  .buscador{margin:0 16px 16px;padding:12px;background:#12121A;border:1px solid #1E1E2A;border-radius:12px;color:#fff;width:calc(100% - 32px);}
  .categoria{padding:0 16px;margin-top:20px;}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:16px;}
  .prod{background:#12121A;border:1px solid #1E1E2A;border-radius:16px;padding:12px;}
  .prod img{width:100%;height:80px;object-fit:contain;margin-bottom:8px;}
  .tag{font-size:10px;color:#00D4FF;}
  .precio{font-size:18px;font-weight:700;margin:6px 0;}
  .precio del{font-size:12px;color:#666;}
  .btn{background:linear-gradient(135deg,#00D4FF,#8B5CF6);border:none;color:#fff;width:100%;padding:10px;border-radius:10px;font-weight:600;}
  nav{position:fixed;top:0;left:-280px;width:260px;height:100%;background:#0F0F14;transition:0.3s;padding:60px 20px;z-index:101;border-right:1px solid #1E1E2A;}
  nav.active{left:0;} nav a{display:block;padding:14px 0;color:#fff;text-decoration:none;border-bottom:1px solid #1E1E2A;}
  .overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);z-index:100;}
  .overlay.active{display:block;}
</style>
</head>
<body>

<header>
  <button class="menu-btn" onclick="toggleMenu()">☰</button>
  <h3>Garfield<span style="color:#00D4FF;">Corp</span></h3>
</header>

<nav id="menu">
  <a href="index.html">Inicio</a>
  <a href="garfield.html">Garfield</a>
  <a href="productos.html">Productos</a>
  <a href="tienda.html">Tienda</a>
  <a href="redes.html">Redes</a>
</nav>
<div class="overlay" onclick="toggleMenu()"></div>

<h2 style="padding:16px 16px 0;">Todos los productos</h2>
<input class="buscador" placeholder="🔍 Buscar producto...">

<div class="filtros">
  <button class="active">Todos</button><button>Bots</button><button>Diamantes</button><button>Design</button><button>Spam</button>
</div>

<div class="categoria"><h3>Diamantes</h3></div>
<div class="grid">
  <div class="prod">
    <div style="font-size:10px;color:#00FF88;">-25%</div>
    <img src="https://via.placeholder.com/100x80/FF8C00/fff">
    <div class="tag">DIAMANTES</div>
    <div style="font-weight:600;">Diamantes 100</div>
    <div style="color:#FFC107;font-size:12px;">★ 4.9</div>
    <div class="precio">S/ 15.00 <del>S/ 20.00</del></div>
    <button class="btn" onclick="location.href='tienda.html'">Añadir al carrito</button>
  </div>
</div>

<div class="categoria"><h3>Bots</h3></div>
<div class="grid">
  <div class="prod">
    <img src="https://via.placeholder.com/100x80/25D366/fff">
    <div class="tag">BOTS</div>
    <div style="font-weight:600;">Bot WhatsApp</div>
    <div style="color:#FFC107;font-size:12px;">★ 4.8</div>
    <div class="precio">S/ 10.00 <del>S/ 14.00</del></div>
    <button class="btn" onclick="location.href='tienda.html'">Añadir al carrito</button>
  </div>
</div>

<script>function toggleMenu(){document.getElementById('menu').classList.toggle('active');document.querySelector('.overlay').classList.toggle('active');}</script>

</body>
</html>
