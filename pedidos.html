<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mis Pedidos - Eventos Garfield</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { background: #0a0a0f; }
 .card { background: #15151d; border: 1px solid #2a2a35; }
 .btn-gradient { background: linear-gradient(90deg, #4f46e5, #9333ea); }
</style>
</head>
<body class="text-white">

<header class="card p-3 flex items-center justify-between sticky top-0 z-10">
  <div class="flex items-center gap-3">
    <img src="https://i.ibb.co/QvK8kZ1A/arcadia-logo.png" class="w-9 h-9 rounded-lg"/>
    <h1 class="text-xl font-bold">Arcadia<span class="text-blue-400">Corps</span></h1>
  </div>
  <button class="text-2xl">🔔</button>
</header>

<div class="p-4 max-w-4xl mx-auto">
  <div class="flex items-center justify-between mb-6">
    <div>
      <p class="text-xs text-cyan-400 font-bold">CUENTA</p>
      <h2 class="text-3xl font-bold">Mis pedidos</h2>
      <p class="text-gray-400 text-sm">Consulta tus packs, total y estado de atención.</p>
    </div>
    <button onclick="window.location='tienda.html'" class="btn-gradient px-5 py-2 rounded-xl font-bold">Ir a la tienda</button>
  </div>

  <!-- PEDIDO -->
  <div class="card rounded-xl p-4">
    <div class="flex justify-between items-start mb-3">
      <div>
        <p class="text-xs text-gray-400">AC-260808-212727-844F</p>
        <p class="font-bold">Pack de 1 producto(s)</p>
        <p class="text-xs text-gray-400">8 ago. 2026, 4:27 p. m.</p>
      </div>
      <span class="bg-blue-500/20 text-blue-400 text-xs px-3 py-1 rounded-full">Pendiente</span>
    </div>
    
    <div class="card p-3 rounded-lg flex items-center justify-between mb-3">
      <div class="flex items-center gap-3">
        <p class="text-2xl text-red-500 font-bold">N</p>
        <div>
          <p class="font-semibold">Netflix Premium 1 Pantalla</p>
          <p class="text-xs text-gray-400">streaming</p>
        </div>
      </div>
      <p class="font-bold">S/ 15.00</p>
    </div>

    <div class="flex justify-between border-t border-gray-700 pt-3">
      <p class="font-bold">Total</p>
      <p class="font-bold text-xl">S/ 15.00</p>
    </div>
  </div>
</div>
</body>
</html>
