<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop - Garfield Store</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="logo">Garfield <span style="color:var(--purple-light)">Store</span></div>
    <nav>
      <a href="index.html">Inicio</a>
      <a href="shop.html">Tienda</a>
      <a href="redes.html">Redes</a>
      <a href="love.html">Love</a>
    </nav>
    <button class="cart-btn" id="cartBtn">🛒 <span id="cartCount">0</span></button>
  </header>

  <main class="content">
    <section class="hero"><h1>Tienda</h1><p>Elige una categoría</p></section>
    <section class="cards">
      <a href="design.html" class="card"><h3>🎨 Design</h3></a>
      <a href="diamantes.html" class="card"><h3>💎 Diamantes</h3></a>
      <a href="spam.html" class="card"><h3>📢 Spam</h3></a>
      <a href="bots.html" class="card"><h3>🤖 Bot</h3></a>
    </section>
  </main>

  <div class="cart-modal" id="cartModal"><div class="cart-content"><h2>Tu Carrito</h2><div id="cartItems"></div><p>Total: S/<span id="cartTotal">0.00</span></p><button class="btn-purple" onclick="checkout()">Pagar por WhatsApp</button><button onclick="toggleCart()">Cerrar</button></div></div>
  <audio id="bgMusic" loop src="garfield.mp3"></audio>
  <button id="musicBtn" class="music-btn">🔊</button>
  <script src="script.js"></script>
</body>
</html>
