<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tienda - Garfield Store</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="shop-page">
  <header>
    <div class="logo">Garfield <span>Store</span></div>
    <nav>
      <a href="index.html">Inicio</a>
      <a href="shop.html" class="active">Tienda</a>
      <a href="redes.html">Redes</a>
      <a href="love.html">Love</a>
    </nav>
    <button class="cart-btn" id="cartBtn">🛒 <span id="cartCount">0</span></button>
  </header>

  <main class="content">
    <section class="hero-shop">
      <h1>🛍️ GARFIELD SHOP</h1>
      <p>Elige tu categoría favorita</p>
    </section>
    <section class="cards-shop">
      <a href="diamantes.html" class="card-shop diamond"><div>💎</div><h3>Diamantes</h3><p>Recargas instantáneas</p></a>
      <a href="design.html" class="card-shop design"><div>🎨</div><h3>Design</h3><p>Logos y Banners</p></a>
      <a href="spam.html" class="card-shop spam"><div>📢</div><h3>Spam</h3><p>Herramientas Pro</p></a>
      <a href="bots.html" class="card-shop bot"><div>🤖</div><h3>Bots</h3><p>Automatización</p></a>
    </section>
  </main>

  <div class="cart-modal" id="cartModal"><div class="cart-content"><h2>Tu Carrito</h2><div id="cartItems"></div><p class="cart-total">Total: S/<span id="cartTotal">0.00</span></p><button class="btn-orange" onclick="checkout()">Pagar por WhatsApp</button><button class="btn-close" onclick="toggleCart()">Cerrar</button></div></div>
  <audio id="bgMusic" loop src="garfield.mp3"></audio>
  <button id="musicBtn" class="music-btn">🔊</button>
  <script src="script.js"></script>
</body>
</html>
