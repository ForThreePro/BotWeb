<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spam - GarfieldStore</title><link rel="stylesheet" href="style.css"></head><body>
<nav><div class="nav-wrap"><div class="nav-left"><div class="hamburger" onclick="toggleMenu()"><span></span><span></span><span></span></div><div class="logo-g">G</div><div class="logo-text">Garfield<span>Store</span></div></div><button class="cart-btn" onclick="toggleCart()">🛒 Carrito <span class="cart-count" id="cart-count">0</span></button></div></nav>
<div class="overlay"></div><div class="side-menu" id="side-menu"><div class="menu-group"><div class="menu-header">📦 PORTAL</div><a href="index.html" class="menu-item"><span class="menu-icon">🏠</span> Inicio</a><a href="shop.html" class="menu-item"><span class="menu-icon">🛒</span> Volver a Tienda</a></div></div>

<div class="container"><div class="hero-card"><div class="hero-label">MARKETING</div><div class="hero-title">Spam WhatsApp</div></div>
<div class="country-tabs" id="tabs-spam">
  <button class="country-tab active" onclick="selectCountry('pe', this, 'spam')">🇵🇪 Peru</button><button class="country-tab" onclick="selectCountry('cl', this, 'spam')">🇨🇱 Chile</button>
  <button class="country-tab" onclick="selectCountry('ar', this, 'spam')">🇦🇷 Argentina</button><button class="country-tab" onclick="selectCountry('mx', this, 'spam')">🇲🇽 Mexico</button>
  <button class="country-tab" onclick="selectCountry('bo', this, 'spam')">🇧🇴 Bolivia</button><button class="country-tab" onclick="selectCountry('uy', this, 'spam')">🇺🇾 Uruguay</button>
  <button class="country-tab" onclick="selectCountry('co', this, 'spam')">🇨🇴 Colombia</button><button class="country-tab" onclick="selectCountry('us', this, 'spam')">🇺🇸 USA</button>
</div>
<div class="form-group"><label class="form-label">Duración</label>
  <select class="form-select" id="dias-spam" onchange="updatePrice('spam')">
    <option value="3dias">3 Días</option><option value="5dias">5 Días</option><option value="1semana">1 Semana</option>
  </select>
</div>
<div class="price-preview">Total: <span id="precio-spam" style="color:var(--green); font-weight:700">S/5.50</span></div>
<div class="form-group"><label class="form-label">Texto a spamear</label><textarea class="form-textarea" id="texto-spam" placeholder="Escribe el texto exacto"></textarea></div>
<div class="form-group"><label class="form-label">Link a promocionar</label><input type="text" class="form-input" id="link-spam" placeholder="https://"></div>
<button class="add-btn" onclick="addSpamToCart()">Agregar al Carrito</button>
<div class="info-text">Spam x3 horas al dia. Si pagas tarde/noche inicia al dia siguiente. Texto tal cual lo mandas.</div>
</div>
<div class="cart-sidebar" id="cart"><div class="cart-header"><div style="font-size:18px; font-weight:700">Tu Carrito</div><div class="cart-close" onclick="toggleCart()">✕</div></div><div id="cart-items" style="flex:1; overflow-y:auto"></div><button class="checkout-btn" onclick="checkoutWhatsApp()">Pedir por WhatsApp</button></div>
<div class="toast" id="toast">Agregado al carrito ✅</div><div class="music-player" id="music-player"><button id="play-btn">▶️</button><span>🎵 Garfield Theme</span></div>
<script src="script.js"></script></body></html>
