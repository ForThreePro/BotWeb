<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><title>Design - Garfield Store</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><style>:root{ --naranja:#FF6B00; --naranja2:#FF8C00; --gris:#F5F5F7; } body { background: var(--gris); font-family: 'Inter', sans-serif; } .btn-primary { background: linear-gradient(90deg, var(--naranja), var(--naranja2)); color: #fff; } .card { background: #fff; border: 1px solid #E5E5E7; }</style></head><body>
<header class="card p-4 flex items-center justify-between sticky top-0 z-30 shadow-sm"><a href="tienda.html" class="font-bold">← Volver</a><a href="producto-carrito.html" id="btnCarrito" class="card px-5 py-2.5 rounded-xl font-bold">🛒 Carrito 0</a></header>
<div class="p-5 max-w-3xl mx-auto"><div class="card rounded-2xl p-6"><p class="text-5xl">🖌️</p><h1 class="text-3xl font-black mt-3">Design Luu</h1>
<p class="mt-4"><b>Tex Logo:</b> S/ 3 | $2 USD</p><p><b>Plantillas 2x1:</b> S/ 4 | $2 USD</p><p><b>Caligráficos 2x1:</b> S/ 3 | $2 USD</p><p><b>Jersey:</b> S/ 5 | $2 USD</p>
<button onclick="agregarCarrito('Tex Logo', 3)" class="btn-primary w-full py-4 rounded-xl mt-6 font-bold">PEDIR TEX LOGO S/3</button>
<button onclick="agregarCarrito('Plantillas 2x1', 4)" class="btn-primary w-full py-4 rounded-xl mt-3 font-bold">PEDIR PLANTILLAS S/4</button>
<div class="bg-orange-50 rounded-xl p-4 mt-4"><p class="text-sm"><b>Aclaración:</b> Pedido demora max 2 días. No devoluciones. Respondo tardes y noches.</p></div></div></div>
<script>let carrito = JSON.parse(localStorage.getItem('carrito')) || [];actualizarCarrito();function agregarCarrito(nombre, precio) { carrito.push({nombre, precio}); localStorage.setItem('carrito', JSON.stringify(carrito)); actualizarCarrito(); alert('✅ ' + nombre + ' añadido'); }function actualizarCarrito() { document.getElementById('btnCarrito').innerText = `🛒 Carrito ${carrito.length}`; }</script></body></html>
