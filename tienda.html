<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garfield Store - Tienda</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#000] text-white font-sans">
  <div class="h-8 bg-blue-600 w-full"></div>

  <header class="sticky top-8 z-40 bg-[#0A0A0A]/80 backdrop-blur border-b border-white/5">
    <div class="flex items-center justify-between px-4 py-3">
      <div class="flex items-center gap-3">
        <button onclick="toggleSidebar()" class="p-2 rounded-lg hover:bg-white/5">☰</button>
        <div class="flex items-center gap-2">
          <div class="w-8 h-8 rounded-xl bg-gradient-to-br from-orange-500 to-red-500 flex items-center justify-center font-bold text-lg">G</div>
          <h1 class="text-lg font-semibold">Garfield<span class="text-green-400">Store</span></h1>
        </div>
      </div>
      <button class="p-2 rounded-xl bg-[#111]">🔔</button>
    </div>
  </header>

  <div class="flex">
    <aside id="sidebar" class="fixed md:static inset-y-0 left-0 z-30 w-64 bg-[#0A0A0A] border-r border-white/5 -translate-x-full md:translate-x-0 transition">
      <div class="p-4 space-y-3">
        <div class="rounded-xl bg-[#111] p-2">
          <button onclick="toggleSection('portal')" class="w-full flex justify-between text-xs">🏠 PORTAL <span id="arrow-portal">▼</span></button>
          <div id="portal" class="mt-2 hidden"><a href="index.html" class="block px-3 py-2 rounded-lg text-sm hover:bg-white/5">Inicio</a></div>
        </div>
        <div class="rounded-xl bg-[#111] p-2">
          <button onclick="toggleSection('redes')" class="w-full flex justify-between text-xs">💬 REDES <span id="arrow-redes">▼</span></button>
          <div id="redes" class="mt-2 hidden">
            <a href="redes.html" class="block px-3 py-2 rounded-lg text-sm hover:bg-white/5">Canal de WhatsApp</a>
            <a href="redes.html" class="block px-3 py-2 rounded-lg text-sm hover:bg-white/5">Comunidad WhatsApp</a>
          </div>
        </div>
        <div class="rounded-xl bg-[#111] p-2">
          <button onclick="toggleSection('shop')" class="w-full flex justify-between text-xs">🛍️ GARFIELD SHOP <span id="arrow-shop">▲</span></button>
          <div id="shop" class="mt-2">
            <a href="tienda.html" class="block px-3 py-2 rounded-lg text-sm bg-gradient-to-r from-purple-600/30 to-blue-600/30">Tienda</a>
            <a href="productos.html" class="block px-3 py-2 rounded-lg text-sm hover:bg-white/5">Productos</a>
          </div>
        </div>
      </div>
    </aside>

    <main class="flex-1 p-6">
      <div class="text-center py-20">
        <div class="text-5xl mb-4">🛍️</div>
        <h2 class="text-3xl font-bold mb-2">Garfield Shop</h2>
        <p class="text-white/60 mb-6">Los mejores servicios de streaming, música, software y más</p>
        <a href="productos.html" class="px-6 py-3 rounded-xl bg-gradient-to-r from-blue-600 to-purple-600 font-semibold">Ver Catálogo Completo</a>
      </div>
    </main>
  </div>

<script>
function toggleSidebar(){ document.getElementById('sidebar').classList.toggle('-translate-x-full') }
function toggleSection(id){
  document.getElementById(id).classList.toggle('hidden');
  document.getElementById('arrow-'+id).innerText = document.getElementById(id).classList.contains('hidden')? '▼' : '▲';
}
</script>
</body>
</html>
