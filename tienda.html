<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tienda - GarfieldCorp</title>
<style>
  body{background:#0A0A0F;color:#fff;font-family:Roboto;}
  header{display:flex;justify-content:space-between;padding:12px 16px;background:#0F0F14;}
  .menu-btn,.cart-btn{background:#1A1A24;border:none;color:#fff;padding:10px;border-radius:12px;}
  .productos{padding:16px;display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
  .item{background:#12121A;border:1px solid #1E1E2A;border-radius:16px;padding:12px;text-align:center;}
  .btn{background:linear-gradient(135deg,#00D4FF,#8B5CF6);border:none;color:#fff;width:100%;padding:10px;border-radius:10px;margin-top:8px;}
  #carrito{position:fixed;bottom:0;left:0;width:100%;background:#12121A;border-top:1px solid #1E1E2A;padding:16px;}
</style>
</head>
<body>
<header>
  <button class="menu-btn" onclick="toggleMenu()">☰</button><h3>Tienda</h3>
  <button class="cart-btn" onclick="alert('Carrito: '+carrito.length)">🛒</button>
</header>

<div class="productos">
  <div class="item"><h4>Diamantes</h4><p>S/5.00</p><button class="btn" onclick="agregar('Diamantes')">Agregar</button></div>
  <div class="item"><h4>Bots</h4><p>S/10.00</p><button class="btn" onclick="agregar('Bots')">Agregar</button></div>
</div>

<div id="carrito">
  <button class="btn" onclick="window.open('https://wa.me/51XXXXXXXXX?text='+carrito.join(', '))">Comprar por WhatsApp</button>
</div>

<script>
let carrito=[]; 
function agregar(p){carrito.push(p);alert(p+" agregado")}
function toggleMenu(){document.getElementById('menu').classList.toggle('active');}
</script>
</body>
</html>
