<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tienda - Garfield Store</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  body{background:#fff;}
  header{display:flex;justify-content:space-between;align-items:center;padding:20px 40px;background:rgba(255,255,255,0.8);backdrop-filter:blur(20px);position:sticky;top:0;z-index:100;}
  .menu-btn{font-size:24px;background:none;border:none;cursor:pointer;}
  .carrito-btn{background:#FF8C00;color:#fff;border:none;padding:10px 16px;border-radius:12px;cursor:pointer;font-weight:600;}
  nav{position:fixed;top:0;left:-300px;width:280px;height:100%;background:#fff;box-shadow:2px 0 20px rgba(0,0,0,0.1);transition:0.3s;padding:60px 20px;z-index:101;}
  nav.active{left:0;}
  nav a{display:block;padding:14px 0;font-size:18px;color:#1d1d1f;text-decoration:none;border-bottom:1px solid #eee;}
  .overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.4);z-index:100;}
  .overlay.active{display:block;}
  .productos{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:24px;padding:40px;max-width:1100px;margin:auto;}
  .producto{background:#F5F5F7;border-radius:18px;padding:20px;text-align:center;}
  .producto h3{margin-bottom:8px;}
  .producto button{background:#FF8C00;color:#fff;border:none;padding:10px 20px;border-radius:12px;cursor:pointer;margin-top:10px;font-weight:600;}
  #carrito{position:fixed;right:-400px;top:0;width:350px;height:100%;background:#fff;box-shadow:-4px 0 20px rgba(0,0,0,0.1);transition:0.3s;padding:20px;z-index:102;}
  #carrito.active{right:0;}
  .cerrar{float:right;font-size:24px;cursor:pointer;}
  #lista p{display:flex;justify-content:space-between;margin:10px 0;}
</style>
</head>
<body>

<header>
  <button class="menu-btn" onclick="toggleMenu()">☰</button>
  <h2>Garfield Shop</h2>
  <button class="carrito-btn" onclick="toggleCarrito()">Carrito</button>
</header>

<nav id="menu">
  <a href="index.html">Inicio</a>
  <a href="index.html#garfield">Garfield</a>
  <a href="redes.html">Redes</a>
  <a href="productos.html">Productos</a>
  <a href="tienda.html">Tienda</a>
</nav>
<div class="overlay" onclick="toggleMenu()"></div>

<section class="productos">
  <div class="producto"><h3>Diamantes</h3><p>$5.00</p><button onclick="agregar('Diamantes - $5.00')">Agregar</button></div>
  <div class="producto"><h3>Bots</h3><p>$10.00</p><button onclick="agregar('Bots - $10.00')">Agregar</button></div>
  <div class="producto"><h3>Spam</h3><p>$3.00</p><button onclick="agregar('Spam - $3.00')">Agregar</button></div>
  <div class="producto"><h3>Design</h3><p>$15.00</p><button onclick="agregar('Design - $15.00')">Agregar</button></div>
</section>

<div id="carrito">
  <span class="cerrar" onclick="toggleCarrito()">X</span>
  <h3>Tu Carrito</h3>
  <div id="lista"></div>
  <a id="comprar" href="https://wa.me/51XXXXXXXXX?text=Hola%20quiero%20comprar:" style="display:block;margin-top:20px;background:#25D366;color:#fff;padding:12px;border-radius:12px;text-align:center;text-decoration:none;font-weight:600;">Comprar por WhatsApp</a>
</div>

<script>
let carrito = [];
function agregar(prod){carrito.push(prod);mostrar();}
function toggleCarrito(){document.getElementById('carrito').classList.toggle('active');}
function toggleMenu(){document.getElementById('menu').classList.toggle('active');document.querySelector('.overlay').classList.toggle('active');}
function mostrar(){
  let lista=document.getElementById('lista');lista.innerHTML='';
  carrito.forEach((p,i)=>{lista.innerHTML+=`<p>${p} <button onclick="borrar(${i})" style="background:red;color:#fff;border:none;border-radius:6px;padding:2px 8px;">X</button></p>`})
}
function borrar(i){carrito.splice(i,1);mostrar();}
</script>

</body>
</html>
