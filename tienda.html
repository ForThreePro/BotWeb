<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Store - Eventos Garfield</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#000; --card:#0A0A0A; --border:#1A1A1A; --naranja:#FF4500; }
  body { background: var(--bg); font-family: 'Inter', sans-serif; color: #E5E5E5; }
.card { background: var(--card); border: 1px solid var(--border); }
.btn-primary { background: var(--naranja); color: #000; font-weight: 800; }
.btn-primary:hover { background: #FF5A1A; }
.filter-btn { background: #111; }
.filter-active { background: var(--naranja); color: #000; }
.card-product:hover { border-color: var(--naranja); }
</style>
</head>
<body>

<header class="card p-4 flex items-center justify-between sticky top-0 z-20">
  <a href="index.html" class="text-xl font-black">GARFIELD<span class="text-orange-500">.</span></a>
  <button onclick="enviarWhatsApp()" id="btnCarrito" class="card px-4 py-2 rounded-lg font-bold">Cart 0</button>
</header>

<div class="p-5 max-w-7xl mx-auto">
  <h2 class="text-4xl font-black mb-2">STORE</h2>
  <p class="text-gray-400 mb-6">Choose your digital services. Instant delivery.</p>

  <div class="flex gap-2 mb-6">
    <button onclick="filtrar('todos')" id="btn-todos" class="filter-btn filter-active px-4 py-2 rounded-lg text-sm font-bold">All</button>
    <button onclick="filtrar('streaming')" id="btn-streaming" class="filter-btn px-4 py-2 rounded-lg text-sm font-bold text-gray-400">Streaming</button>
    <button onclick="filtrar('musica')" id="btn-musica" class="filter-btn px-4 py-2 rounded-lg text-sm font-bold text-gray-400">Music</button>
  </div>

  <div id="productos" class="grid md:grid-cols-4 gap-4">
    <div class="producto streaming card card-product rounded-xl p-5 transition">
      <p class="text-xs text-orange-500 font-bold">-25% OFF</p>
      <p class="text-4xl font-black text-red-500 mt-2">N</p>
      <p class="text-xs text-gray-500 mt-2">STREAMING</p>
      <p class="font-bold text-lg">Netflix 1 Screen</p>
      <p class="text-2xl font-black text-orange-500 mt-3">S/15.00</p>
      <button onclick="agregarCarrito('Netflix 1 Screen', 15)" class="btn-primary w-full py-2.5 rounded-lg mt-4">ADD TO CART</button>
    </div>
    <div class="producto musica card-product rounded-xl p-5 transition">
      <p class="text-xs text-orange-500 font-bold">-29% OFF</p>
      <p class="text-4xl text-green-500 mt-2">●</p>
      <p class="text-xs text-gray-500 mt-2">MUSIC</p>
      <p class="font-bold text-lg">Spotify Premium</p>
      <p class="text-2xl font-black text-orange-500 mt-3">S/10.00</p>
      <button onclick="agregarCarrito('Spotify Premium', 10)" class="btn-primary w-full py-2.5 rounded-lg mt-4">ADD TO CART</button>
    </div>
  </div>
</div>

<script>
let carrito = JSON.parse(localStorage.getItem('carrito')) || [];
actualizarCarrito();

function agregarCarrito(nombre, precio) {
  carrito.push({nombre, precio});
  localStorage.setItem('carrito', JSON.stringify(carrito));
  actualizarCarrito();
}

function actualizarCarrito() {
  document.getElementById('btnCarrito').innerText = `Cart ${carrito.length}`;
}

function filtrar(categoria) {
  document.querySelectorAll('.producto').forEach(p => p.style.display = 'none');
  document.querySelectorAll('.filter-btn').forEach(b => b.className = 'filter-btn px-4 py-2 rounded-lg text-sm font-bold text-gray-400');
  if(categoria === 'todos') {
    document.querySelectorAll('.producto').forEach(p => p.style.display = 'block');
    document.getElementById('btn-todos').className = 'filter-btn filter-active px-4 py-2 rounded-lg text-sm font-bold';
  } else {
    document.querySelectorAll('.' + categoria).forEach(p => p.style.display = 'block');
    document.getElementById('btn-' + categoria).className = 'filter-btn filter-active px-4 py-2 rounded-lg text-sm font-bold';
  }
}

function enviarWhatsApp() {
  if(carrito.length === 0) return alert('Cart empty');
  let usuario = JSON.parse(localStorage.getItem('usuario')) || {name: "Guest", email: ""};
  let total = carrito.reduce((sum, item) => sum + item.precio, 0);
  let mensaje = `*ORDER - GARFIELD*%0A*Client:* ${usuario.name}%0A%0A`;
  carrito.forEach((item, i) => { mensaje += `${i+1}. ${item.nombre} - S/ ${item.precio}.00%0A`; });
  mensaje += `%0A*TOTAL: S/ ${total}.00*`;
  window.open(`https://wa.me/51999999?text=${mensaje}`, '_blank');
  localStorage.removeItem('carrito'); carrito = []; actualizarCarrito();
}
</script>
</body>
</html>
