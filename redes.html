<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GarfieldStore - Redes</title>
<style>
  :root{--bg:#07070d; --card:#0f0f18; --card-border:#1a1a2e; --text:#fff; --text-muted:#7a7f9a; --green:#00ff88;}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Arial, sans-serif; background:var(--bg); color:var(--text)}
  nav{position:sticky; top:0; background:#000; border-bottom:1px solid var(--card-border); z-index:100}
  .nav-wrap{display:flex; justify-content:space-between; align-items:center; padding:12px 16px}
  .nav-left{display:flex; align-items:center; gap:12px}
  .logo-g{width:38px; height:38px; border-radius:12px; background:linear-gradient(135deg, #ff3b30 0%, #ff9500 100%); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:18px}
  .logo-text{font-size:17px; font-weight:700} .logo-text span{color:var(--green)}
  .back-btn{color:#fff; text-decoration:none; font-size:24px}
  .container{max-width:600px; margin:0 auto; padding:20px}
  .page-title{font-size:24px; font-weight:700; margin-bottom:8px}
  .page-sub{color:var(--text-muted); font-size:14px; margin-bottom:24px}
  .red-card{background:var(--card); border:1px solid var(--card-border); border-radius:18px; padding:20px; margin-bottom:16px; display:flex; align-items:center; gap:16px; text-decoration:none; color:#fff; transition:.3s}
  .red-card:hover{transform:translateY(-4px); border-color:var(--green)}
  .red-icon{width:56px; height:56px; border-radius:16px; display:flex; align-items:center; justify-content:center; font-size:28px}
  .whatsapp{background:#25D366}
  .red-info{flex:1}
  .red-name{font-size:18px; font-weight:700; margin-bottom:4px}
  .red-desc{font-size:13px; color:var(--text-muted)}
  .arrow{font-size:20px; color:var(--text-muted)}
</style>
</head>
<body>
<nav>
  <div class="nav-wrap">
    <div class="nav-left">
      <a href="index.html" class="back-btn">←</a>
      <div class="logo-g">G</div>
      <div class="logo-text">Garfield<span>Store</span></div>
    </div>
  </div>
</nav>
<div class="container">
  <div class="page-title">Nuestras Redes</div>
  <div class="page-sub">Únete y no te pierdas nada</div>

  <a href="https://whatsapp.com/channel/0029VaisGFT3AzNMAqLVCJ2Z" target="_blank" class="red-card">
    <div class="red-icon whatsapp">📢</div>
    <div class="red-info">
      <div class="red-name">Canal de WhatsApp</div>
      <div class="red-desc">Ofertas, lanzamientos y novedades. Solo lectura.</div>
    </div>
    <div class="arrow">→</div>
  </a>

  <a href="https://chat.whatsapp.com/C0Mknbe1IiaBkH3WMHINvM" target="_blank" class="red-card">
    <div class="red-icon whatsapp">👥</div>
    <div class="red-info">
      <div class="red-name">Comunidad WhatsApp</div>
      <div class="red-desc">Habla con el staff y otros clientes. Soporte 24/7</div>
    </div>
    <div class="arrow">→</div>
  </a>
</div>
</body>
</html>
