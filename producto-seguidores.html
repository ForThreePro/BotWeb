<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><title>Seguidores - Garfield Store</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><style>:root{ --naranja:#FF6B00; --naranja2:#FF8C00; --gris:#F5F5F7; } body { background: var(--gris); font-family: 'Inter', sans-serif; } .btn-primary { background: linear-gradient(90deg, var(--naranja), var(--naranja2)); color: #fff; } .card { background: #fff; border: 1px solid #E5E5E7; }</style></head><body>
<header class="card p-4 flex items-center justify-between sticky top-0 z-30 shadow-sm"><a href="tienda.html" class="font-bold">← Volver</a><a href="producto-carrito.html" id="btnCarrito" class="card px-5 py-2.5 rounded-xl font-bold">🛒 Carrito 0</a></header>
<div class="p-5 max-w-3xl mx-auto"><div class="card rounded-2xl p-6"><p class="text-5xl">👥</p><h1 class="text-3xl font-black mt-3">Seguidores Instagram</h1>
<p class="mt-4"><b>500 Seguidores:</b> S/ 2.00</p><p><b>1000 Seguidores:</b> S/ 5.00</p><p><b>2000 Seguidores:</b> S/ 9.00</p>
<p class="text-sm text-gray-500 mt-2">Otras monedas: Preguntar a Lu</p>
<button onclick="agregarCarrito('500 Seguidores Instagram', 2)" class="btn-primary w-full py-4 rounded-xl mt-6 font-bold">AÑADIR 500 S/2</button>
<button onclick="agregarCarrito('1000 Seguidores Instagram', 5)" class="btn-primary w-full py-4 rounded-xl mt-3 font-bold">AÑADIR 1000 S/5</button>
<button onclick="agregarCarrito('2000 Seguidores Instagram', 9)" class="btn-primary w-full py-4 rounded-xl mt-3 font-bold">AÑADIR 2000 S/9</button></div></div>
<script>let carrito = JSON.parse(localStorage.getItem('carrito')) || [];actualizarCarrito();function agregarCarrito(nombre, precio) { carrito.push({nombre, precio}); localStorage.setItem('carrito', JSON.stringify(carrito)); actualizarCarrito(); alert('✅ ' + nombre + ' añadido'); }function actualizarCarrito() { document.getElementById('btnCarrito').innerText = `🛒 Carrito ${carrito.length}`; }</script></body></html>
